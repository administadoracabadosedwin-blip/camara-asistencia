

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cámara - Asistencia</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f9;
      text-align: center;
      padding: 20px;
      color: #183b63;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    video, img {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }

    button {
      background: #1769aa;
      color: white;
      border: none;
      padding: 13px 20px;
      margin: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #vistaPrevia {
      display: none;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h2>Foto de asistencia</h2>
    <p>Colócate frente a la cámara.</p>

    <video id="video" autoplay playsinline></video>
    <img id="vistaPrevia" alt="Foto capturada">

    <div>
      <button id="iniciar" onclick="iniciarCamara()">Abrir cámara</button>
      <button id="tomar" onclick="tomarFoto()" style="display:none">
        Tomar foto
      </button>
      <button id="repetir" onclick="repetirFoto()" style="display:none">
        Repetir
      </button>
      <button id="confirmar" onclick="confirmarFoto()" style="display:none">
        Confirmar foto
      </button>
    </div>

    <p id="mensaje"></p>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    let camara = null;
    let foto = null;

    async function iniciarCamara() {
      try {
        const mensaje = document.getElementById("mensaje");
        const video = document.getElementById("video");

        mensaje.textContent = "Solicitando permiso para usar la cámara...";

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("Este navegador no permite acceder a la cámara.");
        }

        const parametros = new URLSearchParams(window.location.search);
        const modoCamara = parametros.get("camara") || "environment";

        camara = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: modoCamara },
          audio: false
        });

        video.srcObject = camara;

        await new Promise(function(resolve) {
          if (video.readyState >= 1) {
            resolve();
          } else {
            video.onloadedmetadata = resolve;
          }
        });

        await video.play();

        document.getElementById("iniciar").style.display = "none";
        document.getElementById("tomar").style.display = "inline-block";

        mensaje.textContent = "Cámara lista. Puedes tomar la foto.";

      } catch (error) {
        detenerCamara();

        document.getElementById("mensaje").textContent =
          "No se pudo abrir la cámara. Revisa los permisos. " +
          error.message;
      }
    }

    function tomarFoto() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      if (!video.videoWidth || !video.videoHeight) {
        document.getElementById("mensaje").textContent =
          "Espera un momento. La cámara todavía está iniciando.";
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const contexto = canvas.getContext("2d");

      const parametros = new URLSearchParams(window.location.search);
      const modoCamara = parametros.get("camara") || "environment";

      const esDispositivoMovil =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const invertirImagen = esDispositivoMovil
        ? modoCamara === "user"
        : true;

      if (invertirImagen) {
        contexto.translate(canvas.width, 0);
        contexto.scale(-1, 1);
      }

      contexto.drawImage(video, 0, 0);

      foto = canvas.toDataURL("image/jpeg", 0.8);

      if (!foto || foto.length < 1000) {
        document.getElementById("mensaje").textContent =
          "No se pudo capturar la fotografía. Intenta nuevamente.";
        return;
      }

      document.getElementById("vistaPrevia").src = foto;
      document.getElementById("vistaPrevia").style.display = "block";

      video.style.display = "none";

      document.getElementById("tomar").style.display = "none";
      document.getElementById("repetir").style.display = "inline-block";
      document.getElementById("confirmar").style.display = "inline-block";

      document.getElementById("mensaje").textContent =
        "Fotografía capturada. Revisa la imagen.";
    }

    function repetirFoto() {
      foto = null;

      document.getElementById("vistaPrevia").style.display = "none";
      document.getElementById("video").style.display = "block";

      document.getElementById("repetir").style.display = "none";
      document.getElementById("confirmar").style.display = "none";
      document.getElementById("tomar").style.display = "inline-block";

      document.getElementById("mensaje").textContent =
        "Puedes tomar otra fotografía.";
    }

    function confirmarFoto() {
      if (!foto) {
        document.getElementById("mensaje").textContent =
          "Primero debes tomar una fotografía.";
        return;
      }

      if (!window.opener || window.opener.closed) {
        document.getElementById("mensaje").textContent =
          "No se pudo conectar con la aplicación de asistencia. " +
          "Regresa a la aplicación e inténtalo nuevamente.";
        return;
      }

      document.getElementById("confirmar").disabled = true;

      try {
        const origenPadre = document.referrer
          ? new URL(document.referrer).origin
          : "*";

        window.opener.postMessage({
          tipo: "FOTO_ASISTENCIA",
          foto: foto
        }, origenPadre);

        document.getElementById("mensaje").textContent =
          "Fotografía enviada a la aplicación. Puedes regresar a ella.";

        detenerCamara();

        setTimeout(function() {
          window.close();
        }, 500);

      } catch (error) {
        document.getElementById("confirmar").disabled = false;

        document.getElementById("mensaje").textContent =
          "No se pudo enviar la fotografía. Intenta nuevamente.";
      }
    }

    function detenerCamara() {
      if (camara) {
        camara.getTracks().forEach(function(pista) {
          pista.stop();
        });

        camara = null;
      }
    }

    window.addEventListener("beforeunload", detenerCamara);
  </script>
</body>
</html>

</html>
